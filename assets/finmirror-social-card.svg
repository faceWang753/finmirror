<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">FinMirror</title>
  <desc id="desc">Paired counterfactual evaluation for reliable financial AI</desc>
  <defs>
    <radialGradient id="glow" cx="82%" cy="8%" r="80%">
      <stop offset="0" stop-color="#2c8f6d" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#14241f" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0b1110" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#39b98a"/>
      <stop offset="1" stop-color="#8ce7c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0b1110"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M0 520C240 430 392 584 640 500s392-16 640-90" fill="none" stroke="#1b2b27" stroke-width="2"/>
  <g transform="translate(72 62)">
    <g>
      <circle cx="26" cy="26" r="24" fill="none" stroke="#39b98a" stroke-width="2"/>
      <path d="M14 26h24M26 14v24" stroke="#8ce7c1" stroke-width="2"/>
      <text x="66" y="35" fill="#f4f1e8" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="750" letter-spacing=".5">FinMirror</text>
    </g>
    <text x="0" y="150" fill="#8ce7c1" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="650" letter-spacing="3">PAIRED COUNTERFACTUAL EVALUATION</text>
    <text x="0" y="230" fill="#f4f1e8" font-family="Inter,Segoe UI,sans-serif" font-size="70" font-weight="760" letter-spacing="-3">Change one fact.</text>
    <text x="0" y="310" fill="#f4f1e8" font-family="Inter,Segoe UI,sans-serif" font-size="70" font-weight="760" letter-spacing="-3">Did the agent change</text>
    <text x="0" y="390" fill="#f4f1e8" font-family="Inter,Segoe UI,sans-serif" font-size="70" font-weight="760" letter-spacing="-3">for the right reason?</text>
    <text x="2" y="456" fill="#a9b2ae" font-family="Inter,Segoe UI,sans-serif" font-size="22">Answers · citations · calculations · confidence · abstention</text>
  </g>
  <g transform="translate(990 170)" filter="url(#shadow)">
    <rect width="210" height="280" rx="28" fill="#111a18" stroke="#2d4039"/>
    <text x="28" y="48" fill="#a9b2ae" font-family="Inter,Segoe UI,sans-serif" font-size="13" letter-spacing="1.4">LICENSED CHANGE</text>
    <text x="28" y="108" fill="#f4f1e8" font-family="Inter,Segoe UI,sans-serif" font-size="46" font-weight="760">W</text>
    <path d="M72 92h62" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="m126 84 12 8-12 8" fill="none" stroke="#8ce7c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="151" y="108" fill="#f4f1e8" font-family="Inter,Segoe UI,sans-serif" font-size="46" font-weight="760">W′</text>
    <line x1="28" y1="140" x2="182" y2="140" stroke="#26322f"/>
    <text x="28" y="177" fill="#8ce7c1" font-family="Inter,Segoe UI,sans-serif" font-size="16">✓ answer</text>
    <text x="28" y="205" fill="#8ce7c1" font-family="Inter,Segoe UI,sans-serif" font-size="16">✓ evidence</text>
    <text x="28" y="233" fill="#8ce7c1" font-family="Inter,Segoe UI,sans-serif" font-size="16">✓ formula</text>
    <text x="28" y="261" fill="#8ce7c1" font-family="Inter,Segoe UI,sans-serif" font-size="16">✓ confidence</text>
  </g>
