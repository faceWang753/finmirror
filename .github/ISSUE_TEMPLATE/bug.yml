name: Bug report
description: Report a reproducible software or evaluator defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not disclose secrets, private data, or security vulnerabilities here."
  - type: input
    id: version
    attributes:
      label: FinMirror version or commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, dataset digest, and the smallest safe input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

