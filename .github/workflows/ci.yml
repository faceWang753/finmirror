name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: finmirror generate
      - run: finmirror validate
      - run: git diff --exit-code benchmark/v0.1
      - run: python -m pytest --cov=finmirror --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: finmirror --version

