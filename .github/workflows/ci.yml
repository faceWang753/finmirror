name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,cohere,openai]"
      - run: finmirror generate
      - run: finmirror validate
      - run: git diff --exit-code benchmark/v0.1
      - run: finmirror demo
      - run: git diff --exit-code artifacts/demo/index.html
      - run: python scripts/build_review_app.py
      - run: git diff --exit-code artifacts/demo/review/data.js
      - run: finmirror trace-demo
      - run: git diff --exit-code artifacts/demo/trace
      - run: finmirror judge-demo
      - run: git diff --exit-code artifacts/demo/judge
      - run: finmirror assure-equivalence
      - run: git diff --exit-code artifacts/demo/equivalence
      - run: finmirror retrieval-demo
      - run: git diff --exit-code artifacts/demo/retrieval
      - run: python -m pytest --cov=finmirror --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: finmirror --version

  action-smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: finmirror
        uses: ./
        with:
          predictions: artifacts/demo/evidence-program/predictions.jsonl
          system: action-smoke-test
          system_version: ${{ github.sha }}
      - name: Verify action outputs
        env:
          FINMIRROR_GATE: ${{ steps.finmirror.outputs.gate }}
          FINMIRROR_SCORE: ${{ steps.finmirror.outputs.audit_score }}
          FINMIRROR_PAIR_RELIABILITY: ${{ steps.finmirror.outputs.pair_reliability }}
        run: |
          test "$FINMIRROR_GATE" = "PASS"
          test "$FINMIRROR_SCORE" = "100.0"
          test "$FINMIRROR_PAIR_RELIABILITY" = "1.000000"
